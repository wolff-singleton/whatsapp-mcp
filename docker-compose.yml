services:
  bridge:
    build: ./whatsapp-bridge
    environment:
      WHATSAPP_BRIDGE_BIND: 0.0.0.0
      # Outbound media root, mounted below at the identical host path so the
      # absolute path the MCP server sends resolves to the same bytes inside
      # the container. The MCP server defaults to this same path.
      WHATSAPP_MEDIA_ROOTS: ${HOME}/.local/share/whatsapp-mcp/outbox
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./whatsapp-bridge/store:/app/store
      - ${HOME}/.local/share/whatsapp-mcp/outbox:${HOME}/.local/share/whatsapp-mcp/outbox
    restart: unless-stopped
